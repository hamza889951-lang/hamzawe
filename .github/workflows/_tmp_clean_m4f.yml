name: Temporary M4F Harness Cleanup

on:
  push:
    branches:
      - hardening/stale-booked-reconciliation

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired M4F harness checks
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('tests/HardeningM4F.test.js')
          src = path.read_text(encoding='utf-8')

          patterns = [
              (r"\nconst CHANGED_FILES = \[.*?\n\];\n\ntest\('M4F-48", "\ntest('M4F-48"),
              (r"test\('M4F-49 .*?(?=test\('M4F-50)", ""),
              (r"test\('M4F-51 .*?(?=test\('M4F-52)", ""),
          ]

          for pattern, replacement in patterns:
              new_src, count = re.subn(pattern, replacement, src, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'cleanup pattern did not match exactly once: {pattern}')
              src = new_src

          if "test('M4F-49" in src or "test('M4F-51" in src:
              raise SystemExit('retired M4F-49/M4F-51 tests still present')
          if 'Application/CalendarRsvpAttendanceService.js' in src:
              raise SystemExit('deleted Calendar RSVP service is still referenced')
          if 'CHANGED_FILES' in src:
              raise SystemExit('stale CHANGED_FILES allowlist is still present')

          path.write_text(src, encoding='utf-8')

      - name: Commit cleanup and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp_clean_m4f.yml
          git add tests/HardeningM4F.test.js
          git diff --cached --check
          git diff --cached -- tests/HardeningM4F.test.js
          git commit -m 'test: remove retired M4F harness checks'
          git push origin HEAD:hardening/stale-booked-reconciliation
