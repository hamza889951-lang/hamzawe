name: Temporary M4F Scheduler Topology Repair
on:
  push:
    branches:
      - hotfix/scheduler-runtime-separation-v2
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify runner and patch M4F
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/HardeningM4F.test.js')
          s = p.read_text(encoding='utf-8')
          old1 = "  // Archive → Maintenance → Horizon → Disruption → Reminders → HealthCheck"
          new1 = "  // Maintenance → Horizon → Disruption → Reminders → HealthCheck; retention runs separately"
          old2 = "  const order = ['ArchiveService.run', 'MaintenanceService.run', 'AvailabilityHorizonMaintainer.ensureHorizon',\n                 'PatientDisruptionService.processDisruptions', 'ReminderService.processPendingReminders',\n                 'HealthCheckService.run'];"
          new2 = "  const order = ['MaintenanceService.run', 'AvailabilityHorizonMaintainer.ensureHorizon',\n                 'PatientDisruptionService.processDisruptions', 'ReminderService.processPendingReminders',\n                 'HealthCheckService.run'];"
          old3 = "  assert.deepStrictEqual(env.st.stageCalls,\n    ['archive', 'maintenance', 'horizon', 'disruption', 'reminders', 'healthCheck'],\n    'later stages still run per the existing partial-failure pattern');"
          new3 = "  assert.deepStrictEqual(env.st.stageCalls,\n    ['maintenance', 'horizon', 'disruption', 'reminders', 'healthCheck'],\n    'later stages still run per the existing partial-failure pattern');"
          for old, new in ((old1,new1),(old2,new2),(old3,new3)):
              if old not in s:
                  raise SystemExit('expected M4F topology block not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify diff and commit
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp_fix_m4f_scheduler_topology.yml
          git add tests/HardeningM4F.test.js
          git diff --cached --check
          git commit -m 'test: update M4F for separated retention scheduler'
          git push origin HEAD:hotfix/scheduler-runtime-separation-v2
