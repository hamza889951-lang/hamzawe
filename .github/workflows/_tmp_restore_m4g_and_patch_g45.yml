name: Temporary M4G Restore and G45 Patch
on:
  push:
    branches:
      - hotfix/scheduler-runtime-separation-v2-final
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore M4G from main and patch only G45
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import re

          target = Path('tests/HardeningM4G.test.js')
          original = subprocess.check_output(
              ['git', 'show', 'origin/main:tests/HardeningM4G.test.js'],
              text=True
          )

          old = """test('G-45 — Single Scheduler order is Archive → Maintenance → Horizon → Disruption → Reminders → HealthCheck', function() {
            const order = ['ArchiveService.run','MaintenanceService.run','AvailabilityHorizonMaintainer.ensureHorizon','PatientDisruptionService.processDisruptions','ReminderService.processPendingReminders','HealthCheckService.run'].map(function(token){return scheduler.indexOf(token);});
            order.forEach(function(index){assert.ok(index>=0,'missing Scheduler stage');});
            for(let i=1;i<order.length;i+=1) assert.ok(order[i-1]<order[i],'Scheduler order is incorrect');
          });"""
          new = """test('G-45 — Operational Scheduler order is Maintenance → Horizon → Disruption → Reminders → HealthCheck; Retention is separated', function() {
            const order = ['MaintenanceService.run','AvailabilityHorizonMaintainer.ensureHorizon','PatientDisruptionService.processDisruptions','ReminderService.processPendingReminders','HealthCheckService.run'].map(function(token){return scheduler.indexOf(token);});
            order.forEach(function(index){assert.ok(index>=0,'missing Scheduler stage');});
            for(let i=1;i<order.length;i+=1) assert.ok(order[i-1]<order[i],'Scheduler order is incorrect');
            assert.strictEqual((scheduler.match(/ArchiveService\\.run\\(\\)/g)||[]).length,0,'Retention must not execute in Scheduler');
            assert.strictEqual(scheduler.indexOf('RetentionService.run('),-1,'Retention must not execute in Scheduler');
          });"""

          if original.count(old) != 1:
              raise SystemExit('G45 original block not found exactly once')
          patched = original.replace(old, new, 1)
          target.write_text(patched, encoding='utf-8')

      - name: Verify only G45 changed from main
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- tests/HardeningM4G.test.js
          test "$(git diff --numstat -- tests/HardeningM4G.test.js | awk '{print $1}')" -ge 1
          test "$(git diff --numstat -- tests/HardeningM4G.test.js | awk '{print $2}')" -ge 1

      - name: Commit and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp_restore_m4g_and_patch_g45.yml
          git add tests/HardeningM4G.test.js
          git diff --cached --check
          git commit -m 'test: restore M4G and isolate G45 scheduler change'
          git push origin HEAD:hotfix/scheduler-runtime-separation-v2-final
