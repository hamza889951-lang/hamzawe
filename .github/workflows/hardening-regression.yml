name: Hardening Regression

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'ci/**'
      - 'feat/**'

permissions:
  contents: write

jobs:
  hardening:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Baghdad
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: One-time M4F scope-gate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/HardeningM4F.test.js')
          s = p.read_text(encoding='utf-8')
          old = "  const committed = execFileSync('git', ['diff', '--name-only', BASELINE, 'HEAD'],\n    { cwd: ROOT, encoding: 'utf8' }).split('\\n').map(function(l) { return l.trim(); });"
          new = """  let baseRef = null;
  ['origin/main', 'main'].some(function(candidate) {
    try {
      execFileSync('git', ['rev-parse', '--verify', candidate], { cwd: ROOT, stdio: 'pipe' });
      baseRef = candidate;
      return true;
    } catch (e) {
      return false;
    }
  });
  assert.ok(baseRef, 'the PR base branch must be available to the governance test');
  const committed = execFileSync('git', ['diff', '--name-only', baseRef + '...HEAD'],
    { cwd: ROOT, encoding: 'utf8' }).split('\\n').map(function(l) { return l.trim(); });"""
          if old not in s:
              raise SystemExit('M4F-51 source pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/HardeningM4F.test.js
          git commit -m 'test: compare M4F scope against PR base'
          target_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$target_ref" in
            refs/pull/*/merge|refs/pull/*/head|'') exit 1 ;;
          esac
          git push origin "HEAD:${target_ref}"
          exit 0

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check Infrastructure/GoogleCalendar.js
          node --check Infrastructure/CalendarRsvpTrigger.js
          node --check Repositories/CalendarRsvpConfigRepository.js
          node --check Repositories/CalendarRsvpSyncRepository.js
          node --check Application/CalendarRsvpAttendanceService.js
          node --check CalendarRsvpEntry.js
          node --check Application/B6LifecycleService.js
          node --check tests/HardeningB6.test.js
          node --check tests/HardeningCalendarRsvpAttendance.test.js

      - name: Targeted Calendar verification test
        shell: bash
        run: node tests/HardeningCalendarDeleteVerification.test.js

      - name: Targeted B6 terminal proof test
        shell: bash
        run: node tests/HardeningB6TerminalProof.test.js

      - name: Targeted Calendar RSVP hardening test
        shell: bash
        run: node tests/HardeningCalendarRsvpAttendance.test.js

      - name: Full hardening regression
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/Hardening*.test.js; do
            echo "===== ${test_file} ====="
            node "${test_file}"
          done
