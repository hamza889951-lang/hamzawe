name: Hardening Regression

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'ci/**'

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check Infrastructure/GoogleCalendar.js
          node --check Application/AttendanceService.js
          node --check AttendanceAddOn.js
          node --check Repositories/CalendarRepository.js
          node --check Application/B6LifecycleService.js
          node --check tests/HardeningCalendarDeleteVerification.test.js
          node --check tests/HardeningB6.test.js
          node --check tests/HardeningB6TerminalProof.test.js
          node --check tests/HardeningM0.test.js

      - name: Targeted Calendar verification test
        shell: bash
        run: |
          set -euo pipefail
          node tests/HardeningCalendarDeleteVerification.test.js

      - name: Targeted B6 terminal proof test
        shell: bash
        run: |
          set -euo pipefail
          node tests/HardeningB6TerminalProof.test.js

      - name: Targeted Attendance identity/UI test
        shell: bash
        run: |
          set -euo pipefail
          node tests/HardeningM0.test.js

      - name: Full hardening regression
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/Hardening*.test.js; do
            echo "===== ${test_file} ====="
            node "${test_file}"
          done
